<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>USDTF dApp</title>
  <link rel="stylesheet" href="style.css" />
  <!-- TronWeb & TronLink integration -->
  <script src="https://cdn.jsdelivr.net/npm/tronweb@latest/dist/TronWeb.js"></script>
</head>
<body>
  <div class="container">
    <h1>USDTF Token Dashboard</h1>

    <!-- Wallet Info -->
    <p><strong>Your Wallet:</strong> <span id="wallet-address">Not connected</span></p>
    <p><strong>TRX Balance:</strong> <span id="trx-balance">--</span></p>
    <p><strong>USDTF Balance:</strong> <span id="token-balance">--</span></p>

    <!-- Send Tokens -->
    <h3>Send USDTF Tokens</h3>
    <input type="text" id="to" placeholder="Recipient Address" />
    <input type="number" id="amount" placeholder="Amount" />
    <button onclick="transfer()">Send</button>
    <p id="txStatus"></p>
  </div>

  <!-- dApp Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@tronweb3/tronwallet-adapter/dist/tronweb.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
