<!DOCTYPE html>
<html>

<head>
  <title>USDTF dApp</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tronweb3/tronwallet-adapter/dist/tronweb.min.js"></script>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tronweb@latest/dist/TronWeb.js"></script>

</head>

<body>
  <div class="container">
    <h1>USDTF Token Dashboard</h1>
    <p><strong>Address:</strong> <span id="userAddress">-</span></p>
    <p><strong>Balance:</strong> <span id="balance">Loading...</span></p>

    <h3>Send Tokens</h3>
    <input id="recipient" placeholder="Recipient address" />
    <input id="amount" placeholder="Amount" />
    <button onclick="transferTokens()">Send</button>
    <p id="txStatus"></p>
    <p>Your Address: <span id="address"></span></p>
    <p>Your Balance: <span id="balance">Loading...</span></p>

    <input type="text" id="to" placeholder="Recipient Address">
    <input type="number" id="amount" placeholder="Amount">
    <button onclick="transfer()">Send USDTF</button>

    <body>
      <h1>USDTF dApp</h1>
      <p id="wallet-address">Not connected</p>
      <p id="trx-balance">TRX Balance: --</p>

      <script src="https://cdn.jsdelivr.net/npm/@tronweb3/tronwallet-adapter/dist/tronweb.min.js"></script>
      <script src="app.js"></script>
    </body>

  </div>

  <script src="abi.js"></script>
  <script src="script.js"></script>
</body>

</html>
